<!doctype html><meta charset="utf-8"><body><script type="module">
import { SONS_ACAO, _usarBase } from '/js/acoes/sons.js';
const q = new URLSearchParams(location.search).get('n'); const nomes = q ? q.split(',') : ['levanta','some','plateiaOh','plateiaAww','pega','carrega','arremesso','golpe','impacto_tomate','impacto_flores','impacto_torta','impacto_balde','impacto_paulada','impacto_cadeirada','queda','zonzo'];
const itens = { pega: 'cadeirada', carrega: 'balde', golpe: 'paulada' };
const db = x => (20 * Math.log10(Math.max(x, 1e-9))).toFixed(1);
for (const comp of (location.search.includes('comp') ? [true] : [false])) for (const n of nomes) {
  const sr = 44100, c = new OfflineAudioContext(2, sr * 8, sr);
  let dest = c.destination;
  if (comp) { const b = c.createDynamicsCompressor(); b.threshold.value = -12; b.ratio.value = 8; b.attack.value = .003; b.release.value = .15; b.connect(c.destination); dest = b; }
  _usarBase(() => ({ c, volume: .7, saida: pan => { const p = c.createStereoPanner(); p.pan.value = pan; p.connect(dest); return p; } }));
  console.log('SOM ini '+n); try { SONS_ACAO[n]({ vol: .6, pan: 0, item: itens[n], dur: 3.9 }); } catch (e) { console.log('SOM ERRO '+n+' '+e.message); continue; }
  const buf = await c.startRendering().catch(e => (console.log('SOM REND '+e.message), null)); if (!buf) continue; let pk = 0, s = 0, ult = 0, cnt = 0;
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > pk) pk = a; s += d[i] * d[i]; if (a > 1e-3) ult = i; } }
  // RMS só da parte sonora
  const L = ult + 1; s = 0; for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < L; i++) s += d[i] * d[i]; }
  console.log(`SOM ${comp ? 'COMP' : 'CRU '} ${n.padEnd(18)} pico ${pk.toFixed(3)} (${db(pk)} dB) rms ${db(Math.sqrt(s / (2 * L)))} dB dur ${(L / sr).toFixed(2)} s fimSilencio ${Math.abs(buf.getChannelData(0)[buf.length - 1]) < 1e-4}`);
}
// suspenso: não deve tocar
_usarBase(() => ({ c: { state: 'suspended', currentTime: 0 }, volume: .7, saida: () => null }));
try { SONS_ACAO.pega({}); console.log('SOM suspenso ok (nada tocou)'); } catch (e) { console.log('SOM suspenso ERRO', e.message); }
console.log('SOM FIM');
</script>
