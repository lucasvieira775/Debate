<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate Presidencial</title>
<style>
:root{
  --bg:#060b1a; --panel:#0f1730; --panel2:#17213f; --line:#24315c;
  --text:#e8ecf8; --muted:#93a0c4; --gold:#f2c14e; --red:#ef4444; --green:#22c55e;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#132049 0%,var(--bg) 55%);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:rgba(6,11,26,.85);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.08em;font-size:15px}
.logo span{color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:28px;margin:6px 0 4px} h2{font-size:20px;margin:0 0 12px} h3{font-size:16px;margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
textarea[readonly]{opacity:.9}
textarea.trancado{border-color:#3b4a80;background:#121a33}
textarea.gravando{border-color:var(--red)}
button{font:inherit;font-weight:600;border-radius:9px;padding:10px 16px;cursor:pointer;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
button:hover{filter:brightness(1.15)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-green{background:var(--green);color:#04210f;border-color:var(--green)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.step.on{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700}
.step.done{color:var(--text);border-color:#3b4a80}
.aviso{background:#3b1d1d;border:1px solid var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;line-height:1.45}
.ok{background:#12301f;border:1px solid var(--green);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.dica{background:#1d2a52;border:1px solid #3b5bb5;border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:10px}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--red);margin-right:6px;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.2}}
.timer{font-variant-numeric:tabular-nums;font-size:40px;font-weight:800}
.timer.alerta{color:var(--red)}
.barra{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.barra>div{height:100%;background:var(--gold);transition:width .2s linear}
.vu{height:6px;width:140px;background:var(--panel2);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.vu>div{height:100%;width:0;background:var(--green);transition:width .08s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:12px;padding:4px 9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.chip.bom{border-color:var(--green);color:#86efac}.chip.ruim{border-color:var(--red);color:#fca5a5}
.nota{font-size:34px;font-weight:800;color:var(--gold)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;font-weight:600}
.contexto{background:var(--panel2);border-left:3px solid var(--gold);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;margin-bottom:10px;line-height:1.45}

/* ---------- Setup ---------- */
.cand-card{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;margin-bottom:12px;background:var(--panel2)}
.cand-av{text-align:center}
.cand-av svg{width:110px;height:auto;background:radial-gradient(circle at 50% 40%,#1d3b8f,#0b1a45);border-radius:12px}
.cand-campos .row{margin-bottom:8px}
.cand-campos input[data-f=nome]{flex:2 1 160px}
.cand-campos input[data-f=partido]{flex:1 1 90px;width:90px}
.cand-campos input[data-f=numero]{width:64px}
.sw-grupo{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-right:8px}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid transparent;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
label.chk{font-size:13px;display:inline-flex;align-items:center;gap:4px}
@media (max-width:640px){.cand-card{grid-template-columns:1fr}.cand-av svg{width:90px}}

/* ---------- Avatar ---------- */
.av .boca-a{opacity:0;transform-box:fill-box;transform-origin:center}
.av.falando .boca-a{opacity:1;animation:boca .16s infinite alternate}
.av.falando .boca-f{opacity:0}
@keyframes boca{from{transform:scaleY(.25)}to{transform:scaleY(1.15)}}
.av .olhos{transform-box:fill-box;transform-origin:center;animation:piscar 5s infinite}
@keyframes piscar{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* ---------- TV / Estúdio ---------- */
.tv{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#050a18;container-type:inline-size;
  box-shadow:0 20px 60px rgba(0,0,0,.55);border:1px solid #1e2a55;margin-bottom:16px}
.cena{position:absolute;inset:0}
.led{position:absolute;left:0;right:0;top:0;height:64%;background:linear-gradient(180deg,#0d2f7a 0%,#0a1f55 55%,#071433 100%);overflow:hidden}
.led::before{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3cqw),
  repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3cqw)}
.led::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 45%,rgba(120,180,255,.16) 50%,transparent 55%);animation:brilho 8s linear infinite}
@keyframes brilho{from{transform:translateX(-35%)}to{transform:translateX(35%)}}
.led-titulo{position:absolute;left:60%;top:7%;transform:translateX(-50%);text-align:center;line-height:.95;white-space:nowrap;z-index:1}
.led-titulo span{display:block;font-size:6cqw;font-weight:900;letter-spacing:.07em;color:#fff;text-shadow:0 0 2cqw rgba(120,170,255,.7)}
.led-titulo b{display:block;font-size:2.9cqw;letter-spacing:.34em;color:var(--gold);margin-top:.4cqw}
.led-sub{position:absolute;left:60%;top:31%;transform:translateX(-50%);font-size:1.2cqw;letter-spacing:.45em;color:#9fb7ff;white-space:nowrap;z-index:1}
.led-tema{position:absolute;left:60%;top:38%;transform:translateX(-50%);display:flex;align-items:center;gap:1cqw;background:rgba(3,10,30,.7);
  border:1px solid rgba(140,180,255,.35);border-radius:.8cqw;padding:.6cqw 1.4cqw;font-size:1.65cqw;font-weight:700;white-space:nowrap;z-index:1;color:#fff}
.led-tema:empty{display:none}
.led-tema .uf{background:var(--gold);color:#1a1300;font-weight:900;border-radius:.5cqw;padding:.2cqw .7cqw;font-size:2cqw}
.led-tema small{display:block;font-size:1cqw;color:#9fb7ff;letter-spacing:.2em;font-weight:600}
.led-tema.girando{border-color:var(--gold);box-shadow:0 0 2cqw rgba(242,193,78,.5)}
.led-tema.revelado{animation:revela .6s ease}
@keyframes revela{0%{transform:translateX(-50%) scale(1.25)}100%{transform:translateX(-50%) scale(1)}}
.feixe{position:absolute;top:-5%;width:16cqw;height:95%;background:linear-gradient(180deg,rgba(190,215,255,.16),transparent 85%);
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);mix-blend-mode:screen;pointer-events:none;z-index:2}
.f1{left:28%;transform:rotate(14deg)}.f2{left:52%}.f3{left:76%;transform:rotate(-14deg)}
.piso{position:absolute;left:0;right:0;bottom:0;height:38%;background:radial-gradient(ellipse at 62% 0%,rgba(70,130,255,.35),transparent 62%),linear-gradient(#0a1838,#03060f)}
.anel{position:absolute;left:27%;right:3%;top:14%;height:62%;border-radius:50%;border:.25cqw solid rgba(120,170,255,.4);box-shadow:0 0 3cqw rgba(80,140,255,.3) inset,0 0 2cqw rgba(80,140,255,.25)}
.pulpito{position:absolute;transition:filter .3s}
.pulpito .pul-av svg{width:100%;display:block}
.pul-mesa{position:relative;width:118%;margin-left:-9%;height:9em;margin-top:-4.8em;background:linear-gradient(180deg,#1d3b8f,#0b1a45 70%,#060f2a);
  border-top:.55em solid var(--c);clip-path:polygon(0 0,100% 0,93% 100%,7% 100%);text-align:center;color:#fff;padding-top:.7em}
.pul-num{font-size:3.3em;font-weight:900;line-height:1}
.pul-nome{font-size:1.05em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 1em}
.pulpito.lit::before{content:"";position:absolute;left:-40%;right:-40%;top:-30%;bottom:25%;background:radial-gradient(ellipse at 50% 45%,rgba(255,240,200,.38),transparent 65%);z-index:-1}
.pulpito.lit .pul-mesa{box-shadow:inset 0 0 2.2em var(--c)}
.pulpito.dim{filter:brightness(.5) saturate(.7)}
.mediadora{position:absolute;left:13%;bottom:2%;width:11cqw;transform:translateX(-50%);font-size:1.1cqw;z-index:15;transition:filter .3s}
.mediadora .pul-av svg{width:100%;display:block}
.med-mesa{position:relative;width:170%;margin-left:-35%;height:7em;margin-top:-4.2em;background:linear-gradient(180deg,rgba(190,215,255,.32),rgba(30,60,130,.6));
  border-top:.35em solid var(--gold);clip-path:polygon(0 0,100% 0,95% 100%,5% 100%);text-align:center;color:#fff;font-size:1em;letter-spacing:.3em;padding-top:1.3em;font-weight:800}
.mediadora.dim{filter:brightness(.55)}
.cena-close{position:absolute;inset:0;animation:corte .35s ease}
@keyframes corte{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.close-bg{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(circle at 62% 38%,color-mix(in srgb,var(--c) 40%,transparent),transparent 42%),
  linear-gradient(180deg,#0d2f7a,#071433)}
.close-bg::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 12% 22%,rgba(150,190,255,.28) 0 2.2cqw,transparent 2.4cqw),
  radial-gradient(circle at 28% 62%,rgba(150,190,255,.18) 0 3cqw,transparent 3.2cqw),
  radial-gradient(circle at 88% 18%,rgba(242,193,78,.22) 0 2.6cqw,transparent 2.8cqw),
  radial-gradient(circle at 92% 70%,rgba(150,190,255,.2) 0 3.4cqw,transparent 3.6cqw),
  radial-gradient(circle at 40% 12%,rgba(150,190,255,.15) 0 1.6cqw,transparent 1.8cqw);filter:blur(.5cqw)}
.close-bg span{position:absolute;left:3%;top:10%;font-size:9cqw;font-weight:900;color:rgba(255,255,255,.07);filter:blur(.35cqw);white-space:nowrap;letter-spacing:.04em;line-height:1}
.close-av{position:absolute;left:62%;bottom:-16%;width:40cqw;transform:translateX(-50%)}
.close-av svg{width:100%;display:block}
.close-mesa{position:absolute;left:44%;width:36cqw;bottom:0;height:12%;background:linear-gradient(#1d3b8f,#060f2a);border-top:.6cqw solid var(--c);
  clip-path:polygon(0 0,100% 0,96% 100%,4% 100%);color:#fff;font-size:4cqw;font-weight:900;text-align:center;line-height:1.5}
.gc{position:absolute;left:3cqw;bottom:3cqw;max-width:56cqw;z-index:20;animation:entra .45s ease}
@keyframes entra{from{transform:translateX(-4cqw);opacity:0}to{transform:none;opacity:1}}
.gc-tag{display:inline-block;background:var(--c);color:#fff;font-weight:800;font-size:max(9px,1.2cqw);letter-spacing:.08em;padding:.35cqw .9cqw;text-transform:uppercase;max-width:56cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-box{background:linear-gradient(90deg,#fff,#e6ecf9);color:#0b1a45;border-left:.8cqw solid var(--c);padding:.55cqw 1.4cqw .65cqw}
.gc-nome{font-size:max(13px,2.5cqw);font-weight:900;text-transform:uppercase;line-height:1.1}
.gc-sub{font-size:max(10px,1.4cqw);color:#3b4a75;font-weight:600}
.tv-timer{position:absolute;right:3cqw;bottom:3cqw;background:#0b1a45;border:.2cqw solid #3b5bb5;color:#fff;padding:.4cqw 1.4cqw;text-align:center;z-index:20}
.tv-timer small{display:block;font-size:max(8px,1cqw);letter-spacing:.2em;color:#9fb7ff}
.tv-timer span{font-size:max(16px,3.3cqw);font-weight:900;font-variant-numeric:tabular-nums}
.tv-timer.alerta{background:#7f1d1d;border-color:var(--red)}
.tv-legenda{position:absolute;left:50%;transform:translateX(-50%);bottom:12.5cqw;width:max-content;max-width:80cqw;background:rgba(0,0,0,.8);color:#fff;
  font-size:max(11px,1.75cqw);line-height:1.35;padding:.5cqw 1.1cqw;z-index:19;text-align:center;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tv-legenda:empty{display:none}
.tv-aovivo{position:absolute;left:2cqw;top:2cqw;background:var(--red);color:#fff;font-weight:900;font-size:max(9px,1.2cqw);padding:.3cqw .9cqw;letter-spacing:.1em;z-index:20;display:flex;align-items:center;gap:.5cqw}
.tv-aovivo::before{content:"";width:.8cqw;height:.8cqw;border-radius:50%;background:#fff;animation:pisca 1s infinite}
.tv-marca{position:absolute;right:2cqw;top:2cqw;font-size:max(9px,1.25cqw);letter-spacing:.2em;color:rgba(255,255,255,.8);font-weight:800;z-index:20}
.tv-marca b{color:var(--gold)}
.tv-nota{position:absolute;right:3cqw;top:6cqw;background:var(--gold);color:#1a1300;font-weight:900;font-size:max(14px,3cqw);padding:.3cqw 1.2cqw;text-align:center;z-index:20;animation:entra .4s;line-height:1.1}
.tv-nota small{display:block;font-size:max(7px,.9cqw);letter-spacing:.15em}
.tv-overlay{position:absolute;inset:0;background:rgba(4,10,30,.85);backdrop-filter:blur(3px);z-index:25;display:flex;align-items:center;justify-content:center;animation:corte .4s}
.poll{width:82%}
.poll-tit{font-size:max(14px,2.5cqw);font-weight:900;color:var(--gold);letter-spacing:.06em;margin-bottom:1.6cqw;text-align:center}
.poll-row{display:grid;grid-template-columns:5cqw 20cqw 1fr 8cqw;align-items:center;gap:1.2cqw;margin:.9cqw 0;font-size:max(11px,1.6cqw);font-weight:700}
.poll-av{width:5cqw;height:5cqw;border-radius:50%;overflow:hidden;background:#1d3b8f;border:.2cqw solid var(--c)}
.poll-av svg{width:100%;height:100%;display:block}
.poll-bar{height:3cqw;background:rgba(255,255,255,.08);border-radius:.4cqw;overflow:hidden}
.poll-pct{font-weight:900;font-size:max(13px,2.4cqw);text-align:right}
.poll-rod{font-size:max(9px,1.1cqw);color:#9fb7ff;text-align:center;margin-top:1.6cqw}
.bar-fill{height:100%;width:0;border-radius:6px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.confete{position:absolute;inset:0;pointer-events:none;z-index:22;overflow:hidden}
.confete i{position:absolute;top:-5%;width:1cqw;height:1.6cqw;animation:cai linear infinite}
@keyframes cai{to{transform:translateY(62cqw) rotate(720deg)}}

/* ---------- Resultado ---------- */
.bar-row{margin:10px 0}
.bar-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px;align-items:center}
.bar-bg{height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}
.mini-av{width:30px;height:30px;border-radius:50%;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px;background:#1d3b8f}
.mini-av svg{width:100%;height:100%;display:block}
.selo{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:800;margin-left:6px}
.selo.eleito{background:var(--green);color:#04210f}.selo.turno{background:var(--gold);color:#1a1300}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tablewrap{overflow-x:auto}
details summary{cursor:pointer;font-weight:600}
.ata-item{border-left:3px solid var(--c);padding:6px 10px;margin:8px 0;background:var(--panel2);border-radius:0 8px 8px 0;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="logo">DEBATE <span>PRESIDENCIAL</span> 2026</div>
  <div id="steps" class="steps"></div>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   DADOS
   ===================================================================== */
const JORN = 'Helena Prado';
const JORN_AV = {pele:'#d19a6a',estilo:'chanel',corCabelo:'#2b1a10',roupa:'#7f1d1d',tipo:'blazer',gravata:'#f5f5f4',oculos:false,barba:false};
const ELEITORADO = 158_000_000;
const CORES = ['#e63946','#3a86ff','#ffbe0b','#2ec4b6','#b5179e'];
const IDEO = {
  'esquerda':        {nome:'Esquerda',        pos:-2, cor:'#dc2626', partido:'PFP'},
  'centro-esquerda': {nome:'Centro-esquerda', pos:-1, cor:'#f97316', partido:'MSD'},
  'centro':          {nome:'Centro',          pos: 0, cor:'#94a3b8', partido:'PUN'},
  'centro-direita':  {nome:'Centro-direita',  pos: 1, cor:'#14b8a6', partido:'ALB'},
  'direita':         {nome:'Direita',         pos: 2, cor:'#2563eb', partido:'POP'},
};
const IDEO_POR_POS = Object.fromEntries(Object.entries(IDEO).map(([k,v])=>[v.pos,k]));
const SEGMENTOS = [
  {id:'esquerda',pos:-2,peso:.18},{id:'centro-esquerda',pos:-1,peso:.17},{id:'centro',pos:0,peso:.28},
  {id:'centro-direita',pos:1,peso:.17},{id:'direita',pos:2,peso:.20}
];

// Áreas temáticas (palavras-chave usadas para medir o foco no tema)
const TEMA_BASE = {
 saude:{nome:'Saúde',kw:['saude','=sus','hospita','medic','posto','fila','vacina','enfermeir','atendimento','doenca','remedio','=upa','cirurgia','sanitari','especialista']},
 educacao:{nome:'Educação',kw:['educa','escola','professor','ensino','aluno','universidade','creche','alfabetiz','tempo integral','=enem','bolsa','tecnic','estudant','aprendiz']},
 seguranca:{nome:'Segurança Pública',kw:['seguranca','policia','crime','violencia','facc','presidio','preso','=arma','=armas','droga','trafic','homicid','fronteira','inteligencia','delegacia','milicia']},
 economia:{nome:'Economia e Emprego',kw:['econom','emprego','desemprego','inflacao','juros','=pib','salario','renda','industria','investiment','crescimento','empresa','trabalho','credito','divida']},
 ambiente:{nome:'Meio Ambiente',kw:['ambient','amazonia','desmatamento','clima','energia','sustentav','floresta','carbono','agua','queimada','renovav','solar','eolica','biodiversidade','indigena']},
 corrupcao:{nome:'Corrupção e Transparência',kw:['corrup','transparen','propina','desvio','lavagem','fiscaliz','controle','licitacao','etica','justica','impunidade','orcamento secreto','emenda','auditoria','denuncia']},
 previdencia:{nome:'Previdência',kw:['previdencia','aposent','=inss','idoso','pensao','beneficio','contribui','deficit','expectativa de vida']},
 impostos:{nome:'Impostos',kw:['imposto','tribut','=iva','icms','carga','taxa','sonega','arrecada','isencao','renda','fortuna','simplific','dividendo']},
 moradia:{nome:'Moradia e Saneamento',kw:['moradia','=casa','=casas','habita','aluguel','minha casa','favela','urbaniza','saneamento','terreno','financiamento','sem teto','periferia']},

function normTxt(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
const norm = normTxt;
const $ = s=>document.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const fmtN=n=>Math.round(n).toLocaleString('pt-BR');
const fmtP=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';
const fmtT=s=>`${String(Math.max(0,s)/60|0).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
const nomeCurto=n=>{const p=n.trim().split(/\s+/);return p.length>2?p[0]+' '+p[p.length-1]:n;};
const reCache={};
function hits(t,list){
  let n=0;
  for(const term of list){
    let re=reCache[term];
    if(!re){const ex=term.startsWith('=');const w=(ex?term.slice(1):term).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      re=reCache[term]=new RegExp('\\b'+w+(ex?'\\b':''),'g');}
    const m=t.match(re); if(m) n+=m.length;
  }
  return n;
}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>clamp(Math.round(v+(p<0?v*p/100:(255-v)*p/100)),0,255);return '#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function avatarAleatorio(){
  const estilo=pick(Object.keys(ESTILOS));
  const feminino=['longo','chanel','coque'].includes(estilo);

    gravata:null,oculos:Math.random()<.3,barba:!feminino&&Math.random()<.3};
}

/* =====================================================================
   ANÁLISE DA FALA
   ===================================================================== */
function analisar(texto, st){
  const t = norm(texto);
  const words = t.match(/[a-z0-9]+/g)||[];
  const wc = words.length;
  const extensao = Math.min(wc/Math.max(15,st.segundos*1.3),1);
  const relevancia = st.kind==='final' ? Math.min(hits(t,TODAS_KW)/5,1) : Math.min(hits(t,temaKw(st.tema))/3,1);
  const propHits = hits(t,PROPOSTA_KW) + (t.match(/\d+/g)||[]).length*.5 + (t.split('%').length-1)*.5;
  const concretude = Math.min(propHits/4,1);
  const apelo = Math.min(hits(t,APELO_KW)/3,1);
  const vicios = hits(t,VICIOS);
  const L=hits(t,LEX.esq), R=hits(t,LEX.dir), C=hits(t,LEX.cen);
  const forca=L+R+C;
  const lean = forca? clamp((R-L)/forca*2,-2,2) : null;
  const outros = S.cands.filter(c=>c.id!==st.falante);
  const mencionados = outros.filter(c=>norm(c.nome).split(/\s+/).filter(p=>p.length>=3).some(p=>hits(t,['='+p])>0) || hits(t,['='+norm(c.partido)])>0);
  if(st.alvo && hits(t,MENCAO_GENERICA)>0 && !mencionados.some(c=>c.id===st.alvo)) mencionados.push(cand(st.alvo));
  const ataque = Math.min(hits(t,ATAQUE_KW),3);
  const W = {proposta:[.25,.30,.30,.15], pergunta:[.30,.40,.10,.20], resposta:[.25,.45,.20,.10],
             replica:[.30,.30,.20,.20], treplica:[.30,.30,.20,.20], final:[.25,.10,.30,.35]}[st.kind];
  let nota = 10*(W[0]*extensao + W[1]*relevancia + W[2]*concretude + W[3]*apelo) - Math.min(vicios*.3,2);
  const fugiu = st.kind==='resposta' && wc>=5 && relevancia<.34;
  if(fugiu) nota -= 1.5;
  if(wc<5) nota = Math.min(nota,1);
  nota = clamp(nota,0,10);
  return {nota,wc,extensao,relevancia,concretude,apelo,vicios,lean,forca,ataque,mencionados:mencionados.map(c=>c.id),fugiu};
}
function aplicar(st, r){
  const c = cand(st.falante);
  const peso = st.etapa===3?1.4:1;
  c.somaNotas += r.nota*peso; c.somaPesos += peso; c.nFalas++;
  if(r.lean!==null){c.leanSum += r.lean*r.forca; c.leanW += r.forca;}
  if(r.fugiu) c.fugas++;
  r.danoEm=[];
  if(r.ataque>0){
    c.ataques += r.ataque;
    for(const id of r.mencionados){ const a=cand(id); a.dano=Math.min(3,a.dano+r.ataque*.3); r.danoEm.push(id); }
  }
  r.rebateu=false;
  if((st.kind==='resposta'||st.kind==='treplica') && r.nota>=6.5 && c.dano>0){ c.dano=Math.max(0,c.dano-.5); r.rebateu=true; }
  if(!c.melhor || r.nota>c.melhor.nota) c.melhor={nota:r.nota,texto:st.texto,kind:st.kind};
}
const perf = c=> c.somaPesos? c.somaNotas/c.somaPesos : 5;
function percebida(c){
  const d = IDEO[c.ideo].pos;
  if(!c.leanW) return d;
  return clamp(d + (c.leanSum/c.leanW-d)*Math.min(c.leanW/8,.6),-2,2);
}
const rotuloPos = p=>IDEO[IDEO_POR_POS[Math.round(p)||0]].nome;

/* =====================================================================
   MODELO ELEITORAL (sistema brasileiro: maioria absoluta dos válidos)
   ===================================================================== */
function utilidade(c,g){
  const d=Math.abs(g.pos-percebida(c));
  const agr=c.ataques/Math.max(1,c.nFalas);
  const tolerancia=[.15,.7,1.3,.7,.15][g.pos+2];
  const mobiliza = Math.abs(g.pos)===2? agr*.25 : 0;
  return .6*perf(c) - 1.5*Math.pow(d,1.25) - .7*c.dano - agr*tolerancia + mobiliza;
}
function apurar(lista, ruido, segundo){
  const abst=Math.min(.35,S.abst+(segundo?.015:0));
  const comparec=ELEITORADO*(1-abst);
  const votos=new Map(lista.map(c=>[c.id,0])); let brancos=0,nulos=0; const seg=[];
  for(const g of SEGMENTOS){
    const tot=comparec*g.peso;
    const us=lista.map(c=>utilidade(c,g)+gauss()*ruido);
    const best=Math.max(...us);
    const bn=clamp(.03+.045*Math.max(0,3.5-best)+(segundo?.02:0),.02,.45);
    const ex=us.map(u=>Math.exp(u-best)); const sum=ex.reduce((a,b)=>a+b,0);
    lista.forEach((c,k)=>votos.set(c.id,votos.get(c.id)+tot*(1-bn)*ex[k]/sum));
    brancos+=tot*bn*.4; nulos+=tot*bn*.6;
    seg.push({g,shares:lista.map((c,k)=>({c,p:ex[k]/sum})).sort((a,b)=>b.p-a.p)});
  }
  const validos=[...votos.values()].reduce((a,b)=>a+b,0);
  const res=lista.map(c=>({c,votos:votos.get(c.id),pct:votos.get(c.id)/validos*100})).sort((a,b)=>b.pct-a.pct);
  return {res,brancos,nulos,abst:ELEITORADO*abst,comparec,validos,seg};
}

const F = {status:'pronto',fim:0,timer:null,rec:null,recAtivo:false,mic:false,final:'',interim:'',erro:'',micMsg:''};
const VU = {stream:null,ctx:null,raf:0,token:0};
async function vuLigar(id){
  const tk=++VU.token;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(tk!==VU.token){stream.getTracks().forEach(t=>t.stop());return;}
    VU.stream=stream; VU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const an=VU.ctx.createAnalyser(); an.fftSize=512; VU.ctx.createMediaStreamSource(stream).connect(an);
    const buf=new Uint8Array(an.fftSize);
    const loop=()=>{ an.getByteTimeDomainData(buf); let s=0; for(const v of buf){const x=(v-128)/128;s+=x*x;}
      const rms=Math.sqrt(s/buf.length); const el=$('#vu'); if(el) el.style.width=Math.min(100,rms*450)+'%';
      if(rms>.035) boca(id,220); VU.raf=requestAnimationFrame(loop); };
    loop();
  }catch(e){ /* o reconhecimento pode funcionar mesmo assim */ }
}

function setMicMsg(m){ F.micMsg=m; const el=$('#mic-status'); if(el) el.textContent=m; }

function micLigar(){
  const st=passo();
  if(!SR){ F.erro='Este navegador não transcreve voz. Use o Google Chrome, ou digite sua fala (o tempo continua correndo).'; renderPainel(); return; }
  pararJornalista();
  F.final=(st.rascunho||'').trim(); if(F.final) F.final+=' '; F.interim=''; F.erro='';
  const rec=new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  rec.onstart=()=>setMicMsg('Microfone ligado — pode falar.');
  rec.onspeechstart=()=>setMicMsg('Ouvindo e transcrevendo…');
  rec.onresult=e=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal) F.final+=r[0].transcript.trim()+' '; else interim+=r[0].transcript;
    }
    F.interim=interim; st.rascunho=(F.final+F.interim).trim();

    atualizarLegenda(); boca(st.falante,500); setMicMsg('Ouvindo e transcrevendo…');
  };
  rec.onerror=e=>{
    if(e.error==='no-speech'||e.error==='aborted') return;
    F.recAtivo=false; F.mic=false; F.rec=null; vuDesligar();
    F.erro=msgErroSR(e.error)+' Você pode continuar digitando — o tempo segue correndo.';
    renderPainel();
  };
  rec.onend=()=>{ if(F.recAtivo){ try{rec.start()}catch(_){} } };
  F.rec=rec; F.recAtivo=true; F.mic=true; F.micMsg='Ligando microfone…';
  try{ rec.start(); }catch(e){ F.recAtivo=false; F.mic=false; F.rec=null; F.erro=msgErroSR(e.name||'start'); }
  if(F.mic) vuLigar(st.falante);

}

function iniciarDebate(){
  S.cands=S.cands.map((c,k)=>({...c,av:{...c.av},id:'c'+k,cor:CORES[k],somaNotas:0,somaPesos:0,nFalas:0,leanSum:0,leanW:0,ataques:0,dano:0,fugas:0,melhor:null}));

  const f=[];

  f.push({tipo:'intro',etapa:1,texto:`Boa noite! Eu sou ${JORN} e começa agora o debate entre os candidatos à Presidência da República: ${lista}. No primeiro bloco, cada candidato apresenta propostas sobre um tema sorteado entre os 27 estados brasileiros.`});
  S.cands.forEach(c=>f.push({tipo:'fala',etapa:1,kind:'proposta',falante:c.id,tema:sortearTema()}));
  f.push({tipo:'pesquisa',etapa:1,titulo:'Pesquisa relâmpago · após o 1º bloco'});

  S.cands.forEach(c=>f.push({tipo:'escolha',etapa:2,falante:c.id}));
  f.push({tipo:'pesquisa',etapa:2,titulo:'Pesquisa relâmpago · após o 2º bloco'});
  f.push({tipo:'intro',etapa:3,texto:`Chegamos ao terceiro e último bloco: as considerações finais. A ordem foi sorteada. É a última chance de convencer o eleitor.`});
  shuffle(S.cands.slice()).forEach(c=>f.push({tipo:'fala',etapa:3,kind:'final',falante:c.id}));
  f.forEach(p=>{ if(p.tipo==='fala') p.segundos=Math.round(SEGUNDOS[p.kind]*DUR_MULT[S.cfg.dur]); });
  S.fila=f; S.tela='debate'; irPara(0);
}

  } else {

function proximo(){ if(S.i+1<S.fila.length) irPara(S.i+1); else finalizarDebate(); }
function textoJornalista(st){
  const c=cand(st.falante), a=st.alvo&&cand(st.alvo), s=st.segundos, t=st.tema&&TUF[st.tema];
  switch(st.tipo){
    case 'intro': return st.texto;
    case 'pesquisa': return `Vamos aos números. O instituto divulga agora uma pesquisa relâmpago de intenção de voto.`;
    case 'escolha': return `${c.nome}, é a sua vez de perguntar. Escolha o adversário; o tema será sorteado.`;
  }
  switch(st.kind){
    case 'proposta': return `${c.nome}, o tema sorteado vem ${t.de}: ${t.titulo}. ${t.pergunta} Você tem ${s} segundos.`;
    case 'pergunta': return `${c.nome}, o tema sorteado vem ${t.de}: ${t.titulo}. Faça a sua pergunta para ${a.nome}. ${s} segundos.`;
    case 'resposta': return `${c.nome}, a sua resposta sobre ${t.titulo}. ${s} segundos.`;
    case 'replica':  return `Réplica, ${c.nome}. ${s} segundos.`;
    case 'treplica': return `Tréplica, ${c.nome}. ${s} segundos.`;

  renderDebate(); falarJornalista(st.textoJ);
  roleta(tema,()=>{
    const m=DUR_MULT[S.cfg.dur], sec=k=>Math.round(SEGUNDOS[k]*m), base={tipo:'fala',etapa:2,tema};
    S.fila.splice(S.i+1,0,
      {...base,kind:'pergunta',falante:st.falante,alvo,segundos:sec('pergunta')},
      {...base,kind:'resposta',falante:alvo,alvo:st.falante,segundos:sec('resposta')},
      {...base,kind:'replica',falante:st.falante,alvo,segundos:sec('replica')},
      {...base,kind:'treplica',falante:alvo,alvo:st.falante,segundos:sec('treplica')});
    renderDebate(true);
    roletaTo=setTimeout(proximo,1400);
  });
}
function finalizarDebate(){
  resetFala(); pararRoleta();
  S.r1=apurar(S.cands,.45,false);
  const top=S.r1.res[0];
  S.eleito1 = top.pct>50 || S.cands.length===2;
  if(!S.eleito1) S.r2=apurar([S.r1.res[0].c,S.r1.res[1].c],.35,true);
  S.tela='resultado'; S.temaAtual=null; render(); window.scrollTo({top:0});
  falarJornalista(S.eleito1? `Apuração encerrada. ${top.c.nome} está eleito no primeiro turno, com ${fmtP(top.pct)} dos votos válidos.` : `Apuração encerrada. Nenhum candidato alcançou a maioria dos votos válidos. Teremos segundo turno entre ${S.r1.res[0].c.nome} e ${S.r1.res[1].c.nome}.`);
}

function testarMic(){
  const out=$('#teste-out'), btn=$('#teste-mic');
  if(!SR){ out.innerHTML='<span style="color:#fca5a5">Sem reconhecimento de voz neste navegador. Use o Google Chrome.</span>'; return; }
  const rec=new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true;
  let ouviu=false, erro=false;
  btn.disabled=true; out.textContent='Fale alguma coisa nos próximos 7 segundos…';
  rec.onresult=e=>{ ouviu=true; let s=''; for(let i=0;i<e.results.length;i++) s+=e.results[i][0].transcript; out.innerHTML='<span style="color:#86efac">✔ Funcionando! Ouvi:</span> '+esc(s); };
  rec.onerror=e=>{ if(e.error==='no-speech'||e.error==='aborted')return; erro=true; out.innerHTML='<span style="color:#fca5a5">✖ '+esc(msgErroSR(e.error))+'</span>'; };
  rec.onend=()=>{ btn.disabled=false; if(!ouviu&&!erro) out.innerHTML='<span style="color:#fca5a5">Não captei nenhuma fala. Verifique se o microfone certo está selecionado (ícone de microfone na barra de endereço do Chrome).</span>'; };
  try{ rec.start(); }catch(e){ btn.disabled=false; out.textContent='Erro ao iniciar: '+e.message; return; }
  setTimeout(()=>{try{rec.stop()}catch(_){}} ,7000);
}

  } else if(F.status==='encerrando'){ status=`<div class="dica">${F.porTempo?'⏰ Tempo esgotado! ':''}Finalizando a transcrição…</div>`; }
  else if(avaliado){
    status=`<div style="margin-bottom:8px;font-size:14px" class="muted">🔒 Fala registrada${F.porTempo?' (tempo esgotado)':''}. Não é mais possível editar.</div>`;
    botoes=`<button class="btn-gold" id="b-prox">Próximo ▶</button>`; extra=avaliacaoHTML(st);
  }
  const tempoTxt = ativo? fmtT(restante()) : avaliado||F.status==='encerrando' ? '00:00' : fmtT(st.segundos);
  const pct = ativo? (Math.max(0,F.fim-Date.now())/(st.segundos*1000)*100) : F.status==='pronto'?100:0;
  el.innerHTML=`<div class="card" style="border-color:${c.cor}">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div style="display:flex;gap:12px;align-items:center">
        <span class="mini-av" style="width:52px;height:52px">${avatarDe(c,{rosto:true,semId:true})}</span>
        <div><div style="font-size:12px;color:var(--muted)">${KIND_NOME[st.kind].toUpperCase()}</div>
        <h2 style="margin:2px 0">${esc(c.nome)}</h2>
        <div class="muted" style="font-size:14px">${esc(c.partido)} ${esc(c.numero)} · ${IDEO[c.ideo].nome}${alvoTxt}</div></div>
      </div>
      <div class="timer ${ativo&&restante()<=10?'alerta':''}" id="timer">${tempoTxt}</div>
    </div>
    <div class="barra"><div id="tbar" style="width:${pct}%"></div></div>
    ${t&&!S.roletando?`<div class="contexto"><b>${t.uf} · ${esc(t.estado)} — ${esc(t.titulo)}</b><br>${esc(t.pergunta)}</div>`:''}
    ${F.erro?`<div class="aviso">${esc(F.erro)}</div>`:''}
    ${status}
    <textarea id="transc" class="${avaliado?'trancado':''} ${ativo&&F.mic?'gravando':''}" ${travado?'readonly':''} placeholder="${F.status==='pronto'?'Comece a digitar aqui (o tempo começa a contar) ou clique em Falar no microfone…':ativo&&F.mic?'Fale: a transcrição aparece aqui…':'Digite sua fala…'}">${esc(st.texto??st.rascunho??'')}</textarea>
    <div class="row" style="margin-top:10px">${botoes}</div>
    ${extra}
  </div>`;
  const ta=$('#transc');
  ta.addEventListener('input',()=>{
    if(ta.readOnly) return;
    st.rascunho=ta.value; atualizarLegenda(); boca(st.falante,350);
    if(F.status==='pronto' && ta.value.length>0) iniciarTurno(false);
  });
  const on=(id,fn)=>{const b=$(id); if(b) b.onclick=fn;};
  on('#b-falar',()=>iniciarTurno(true));
  on('#b-mic',()=>{ if(F.mic) micDesligar(()=>{renderPainel();focarTexto();}); else micLigar(); });
  on('#b-conf',()=>encerrar(false));
  on('#b-prox',proximo);
  on('#b-pular',()=>{ if(confirm('Pular a vez? A fala vazia recebe nota mínima.')){ st.rascunho=''; F.status='ativo'; encerrar(false); } });
  if(ativo&&!F.mic) focarTexto();
}

function avaliacaoHTML(st){
  const r=st.res, c=cand(st.falante);
  if(!S.cfg.notas) return '';
  const nivel=v=>v>=.67?'bom':v<.34?'ruim':'';
  const dots=v=>'●'.repeat(Math.round(v*3))+'○'.repeat(3-Math.round(v*3));
  const chips=[
    `<span class="chip">${r.wc} palavras</span>`,
    `<span class="chip ${nivel(r.relevancia)}">Foco no tema ${dots(r.relevancia)}</span>`,
    `<span class="chip ${nivel(r.concretude)}">Propostas concretas ${dots(r.concretude)}</span>`,
    `<span class="chip ${nivel(r.apelo)}">Apelo ao eleitor ${dots(r.apelo)}</span>`,
    `<span class="chip ${nivel(r.extensao)}">Uso do tempo ${dots(r.extensao)}</span>`,
  ];
  if(r.lean!==null){ const t=r.lean<-.6?'à esquerda':r.lean>.6?'à direita':'ao centro'; chips.push(`<span class="chip">Discurso soou ${t}</span>`); }
  if(r.ataque>0) chips.push(`<span class="chip ruim">Ataques: ${r.ataque}${r.danoEm.length?' → '+r.danoEm.map(id=>esc(cand(id).nome)).join(', '):''}</span>`);
  if(r.fugiu) chips.push(`<span class="chip ruim">Fugiu da pergunta</span>`);
  if(r.rebateu) chips.push(`<span class="chip bom">Rebateu bem as críticas</span>`);
  if(r.vicios) chips.push(`<span class="chip ruim">Vícios de linguagem: ${r.vicios}</span>`);
  const dicas=[];
  if(r.wc<5) dicas.push('Praticamente não houve fala, e o eleitor percebeu.');
  else{
    if(r.extensao<.4) dicas.push('Fala curta: aproveite melhor o tempo.');
    if(r.relevancia<.34 && st.kind!=='final') dicas.push(`Pouco foco no tema: cite ${TUF[st.tema].estado} e o problema “${TUF[st.tema].titulo}”.`);
    if(r.concretude<.34) dicas.push('Faltaram propostas concretas: metas, números, “vou criar…”.');
    if(r.apelo<.34) dicas.push('Fale mais com o eleitor: famílias, futuro, “você”.');
    if(r.ataque>0) dicas.push('Ataques empolgam a sua base, mas afastam o eleitor de centro.');
    if(r.lean!==null && Math.abs(r.lean-IDEO[c.ideo].pos)>=2.5) dicas.push('O discurso destoou do seu espectro e pode confundir sua base.');
  }
  return `<div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
    <div class="row"><span class="nota">${r.nota.toFixed(1)}</span><span class="muted">/ 10 · análise dos comentaristas</span></div>
    <div class="chips">${chips.join('')}</div>
    ${dicas.length?`<div class="muted" style="font-size:14px">${dicas.map(esc).join('<br>')}</div>`:''}
  </div>`;
}

/* ---------- Resultado ---------- */
function barras(res,{votos=false,vencedor=null}={}){
  return res.map(x=>`
    <div class="bar-row">
      <div class="bar-top"><span><span class="mini-av">${avatarDe(x.c,{rosto:true,semId:true})}</span><b>${esc(x.c.nome)}</b> <span class="muted">${esc(x.c.partido)} ${esc(x.c.numero)}</span>${vencedor===x.c.id?'<span class="selo eleito">ELEITO(A)</span>':''}</span>
        <span><b>${fmtP(x.pct)}</b>${votos?` <span class="muted">· ${fmtN(x.votos)} votos</span>`:''}</span></div>
      <div class="bar-bg"><div class="bar-fill" data-w="${x.pct}" style="background:${x.c.cor}"></div></div>
    </div>`).join('');
}
function resumoApuracao(r){
  return `<div class="row muted" style="font-size:13px;gap:18px;margin-top:8px">
    <span>Eleitorado: ${fmtN(ELEITORADO)}</span><span>Comparecimento: ${fmtN(r.comparec)}</span>
    <span>Abstenção: ${fmtN(r.abst)} (${fmtP(r.abst/ELEITORADO*100)})</span>
    <span>Brancos: ${fmtN(r.brancos)}</span><span>Nulos: ${fmtN(r.nulos)}</span><span>Válidos: ${fmtN(r.validos)}</span></div>`;
}
function renderResultado(){
  renderSteps();
  const r1=S.r1, top=r1.res[0];
  const definido = S.eleito1 || S.mostrar2;
  const eleito = S.eleito1? top.c : S.r2.res[0].c;
  const r2pct = S.mostrar2 ? S.r2.res[0].pct : top.pct;
  const tv = definido
    ? tvHTML({cena:'close',foco:eleito,confete:true,gc:{tag:'Presidente eleito(a) · '+(S.eleito1?'1º turno':'2º turno'),nome:eleito.nome,sub:`${eleito.partido} ${eleito.numero} · ${fmtP(r2pct)} dos votos válidos`,cor:eleito.cor}})
    : tvHTML({cena:'geral',overlay:pollHTML('APURAÇÃO · 1º TURNO',r1.res,'Nenhum candidato passou de 50% dos votos válidos: haverá 2º turno')});
  let html=tv+`
  <div class="card"><h2>1º Turno ${S.eleito1?'<span class="selo eleito">DEFINIDO NO 1º TURNO</span>':'<span class="selo turno">HAVERÁ 2º TURNO</span>'}</h2>
    <p class="muted" style="margin-top:-6px">Percentual sobre os votos válidos (brancos e nulos não contam), como no TSE. Vence no 1º turno quem tiver mais de 50% dos válidos.</p>
    ${barras(r1.res,{votos:true,vencedor:S.eleito1?top.c.id:null})}
    ${!S.eleito1?`<p>Ninguém atingiu a maioria absoluta. <b>${esc(r1.res[0].c.nome)}</b> e <b>${esc(r1.res[1].c.nome)}</b> disputam o 2º turno.</p>`:''}
    ${resumoApuracao(r1)}
  </div>`;
  if(!S.eleito1){
    html+= S.mostrar2 ? `<div class="card" style="border-color:var(--gold)"><h2>2º Turno</h2>
      ${barras(S.r2.res,{votos:true,vencedor:eleito.id})}${resumoApuracao(S.r2)}</div>`
      : `<button class="btn-gold" id="b-2t" style="margin-bottom:16px;font-size:17px;padding:13px 26px">Apurar o 2º turno ▶</button>`;
  }
  const rs = S.mostrar2? S.r2 : r1;
  html+=`<div class="grid2">
    <div class="card"><h2>Desempenho no debate</h2><div class="tablewrap"><table>
      <tr><th>Candidato</th><th>Nota</th><th>Percebido como</th><th>Ataques</th><th>Fugas</th></tr>
      ${S.cands.slice().sort((a,b)=>perf(b)-perf(a)).map(c=>`<tr><td><span class="mini-av">${avatarDe(c,{rosto:true,semId:true})}</span>${esc(c.nome)}<br><span class="muted" style="font-size:12px">declarou ${IDEO[c.ideo].nome}</span></td>
        <td><b>${perf(c).toFixed(1)}</b></td><td>${rotuloPos(percebida(c))}</td><td>${c.ataques}</td><td>${c.fugas}</td></tr>`).join('')}
    </table></div></div>
    <div class="card"><h2>Voto por segmento ${S.mostrar2?'(2º turno)':'(1º turno)'}</h2><div class="tablewrap"><table>
      <tr><th>Eleitor</th><th>Peso</th><th>Preferência</th></tr>
      ${rs.seg.map(s=>`<tr><td>${IDEO[s.g.id].nome}</td><td>${Math.round(s.g.peso*100)}%</td>
        <td>${s.shares.slice(0,2).map(x=>`<span style="color:${x.c.cor}">●</span> ${esc(x.c.nome)} ${Math.round(x.p*100)}%`).join('<br>')}</td></tr>`).join('')}
    </table></div></div>
  </div>
  <div class="card"><h2>Melhores momentos</h2>
    ${S.cands.filter(c=>c.melhor&&c.melhor.texto).map(c=>`<div class="ata-item" style="--c:${c.cor}"><b>${esc(c.nome)}</b> <span class="muted">(${KIND_NOME[c.melhor.kind]}, nota ${c.melhor.nota.toFixed(1)})</span><br>“${esc(c.melhor.texto.slice(0,280))}${c.melhor.texto.length>280?'…':''}”</div>`).join('')||'<p class="muted">Nenhuma fala registrada.</p>'}
  </div>
  <div class="card"><details><summary>Ata completa do debate</summary>
    ${S.fila.filter(p=>p.tipo==='fala'&&p.res).map(p=>{const c=cand(p.falante);return `<div class="ata-item" style="--c:${c.cor}">
      <span class="muted" style="font-size:12px">Bloco ${p.etapa} · ${KIND_NOME[p.kind]}${p.tema?' · '+TUF[p.tema].uf+' — '+esc(TUF[p.tema].titulo):''} · nota ${p.res.nota.toFixed(1)}</span><br>
      <b>${esc(c.nome)}:</b> ${esc(p.texto)||'<i class="muted">(sem fala)</i>'}</div>`}).join('')}
  </details></div>
  <div class="row"><button class="btn-gold" id="b-rev">↺ Revanche (mesmos candidatos)</button><button id="b-novo">Nova partida</button></div>`;
  $('#app').innerHTML=html;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w+'%')));
  const b2=$('#b-2t'); if(b2) b2.onclick=()=>{ S.mostrar2=true; renderResultado(); window.scrollTo({top:0,behavior:'smooth'});
    const w=S.r2.res[0]; falarJornalista(`${w.c.nome} vence o segundo turno, com ${fmtP(w.pct)} dos votos válidos, e é eleito presidente da República.`); };
  const limpar=()=>S.cands.map(c=>({nome:c.nome,partido:c.partido,numero:c.numero,ideo:c.ideo,av:{...c.av}}));
  $('#b-rev').onclick=()=>{S.cands=limpar();iniciarDebate();};
  $('#b-novo').onclick=()=>{pararJornalista();S.cands=limpar();S.tela='setup';render();};
}

render();
</script>
</body>
</html>
